<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="glow0"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="glow1"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="glow2"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="glow3"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="720" height="200" fill="#0d1117"/>
<rect x="10.0" y="25" width="160" height="150" rx="14" fill="#161b22" stroke="#00e5ff" stroke-width="1.3" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.0s" fill="freeze"/>
</rect>
<rect x="10.0" y="25" width="0" height="4" rx="2" fill="#00e5ff" filter="url(#glow0)">
  <animate attributeName="width" from="0" to="160" dur="0.6s" begin="0.0s" fill="freeze"/>
</rect>
<text x="90.0" y="65" font-size="26" text-anchor="middle">🧠</text>
<g transform="translate(90.0 105) scale(0)">
  <animateTransform attributeName="transform" type="scale" additive="sum" from="0" to="1" dur="0.55s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 1.4 0.4 1" keyTimes="0;1" values="0;1"/>
  <text x="0" y="0" fill="#00e5ff" font-family="Fira Code, monospace" font-size="24" font-weight="700" text-anchor="middle">42</text>
</g>
<text x="90.0" y="137" fill="#8b949e" font-family="Fira Code, monospace" font-size="10.5" text-anchor="middle" opacity="0">
  <tspan x="90.0" dy="0">Models</tspan>
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
</text>
<text x="90.0" y="151" fill="#8b949e" font-family="Fira Code, monospace" font-size="10.5" text-anchor="middle" opacity="0">
  Fine-tuned
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze"/>
</text>
<circle cx="90.0" cy="101" r="4" fill="#00e5ff" opacity="0">
  <animate attributeName="r" values="4;60" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.35;0" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
</circle>
<rect x="190.0" y="25" width="160" height="150" rx="14" fill="#161b22" stroke="#ff6ec7" stroke-width="1.3" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze"/>
</rect>
