  <animate attributeName="opacity" values="0.35;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
</circle>
<rect x="550.0" y="25" width="160" height="150" rx="14" fill="#161b22" stroke="#00e5a0" stroke-width="1.3" opacity="0">
